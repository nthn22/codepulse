# Destroy CodePulse
# Manual only. Type "destroy" in the prompt to confirm.

name: Destroy CodePulse

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: codepulse-infra
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      # image_tag has no default, so pass a placeholder; it doesn't matter for destroy
      - name: Terraform destroy
        run: terraform destroy -auto-approve -var="image_tag=destroy"