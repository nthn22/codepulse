# Deploy CodePulse
# - On every push to main: run tests and verify the Docker image builds (no AWS, no cost)
# - On "Run workflow" button: create infra, push the image, start the service

name: Deploy CodePulse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

# deploy and destroy share this group so they never run at the same time
concurrency:
  group: codepulse-infra
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}   # repo variable (Settings > Secrets and variables > Variables)

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (verify only, no push)
        run: docker build -t codepulse:${{ github.sha }} .

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'   # only when you press the button
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}   # repo variable
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # so terraform output -raw returns clean values

      - name: Terraform init
        run: terraform init

      - name: Create infra (no tasks yet)
        run: terraform apply -auto-approve -var="image_tag=${{ github.sha }}" -var="desired_count=0"

      - name: Set Claude API key in Secrets Manager
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # repo secret
        run: |
          aws secretsmanager put-secret-value \
            --secret-id codepulse-claude-secret \
            --secret-string "$ANTHROPIC_API_KEY" > /dev/null

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: .   # repo root, where the Dockerfile is
        run: |
          IMAGE=$(terraform -chdir=infra output -raw repository_url)
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Start the service
        run: terraform apply -auto-approve -var="image_tag=${{ github.sha }}" -var="desired_count=1"

      - name: Wait for the service to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform output -raw ecs_cluster_name)" \
            --services "$(terraform output -raw ecs_service_name)"

      - name: Show app URL
        run: |
          echo "App URL: $(terraform output -raw alb_url)" >> "$GITHUB_STEP_SUMMARY"